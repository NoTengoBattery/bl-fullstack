---
inherit_from:
  - .rubocop_todo.yml
inherit_gem:
  rubocop-factory_bot: config/default.yml
  rubocop-faker: config/default.yml
  rubocop-performance: config/default.yml
  rubocop-rails: config/default.yml
  rubocop-rake: config/default.yml
  rubocop-rspec_rails: config/default.yml
  rubocop-rspec: config/default.yml
  rubocop-thread_safety: config/default.yml
inherit_mode:
  merge:
    - Exclude
plugins:
  - rubocop-factory_bot
  - rubocop-faker
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-thread_safety
AllCops:
  NewCops: enable
  TargetRailsVersion: <%= `rails -v`.split.last %>
  TargetRubyVersion: <%= File.read(".ruby-version").strip %>
  Exclude:
    - ".bundle/**/*"
    - ".eslintcache"
    - ".pnpm-store/**/*"
    - "coverage/**/*"
    - "db/*.sqlite3"
    - "dist/**/*"
    - "log/**/*"
    - "node_modules/**/*"
    - "public/**/*"
    - "public/packs/**/*"
    - "storage/**/*"
    - "tmp/**/*"
    - "vendor/bundle/**/*"
    - "vite-dev/**/*"
    - "vite-test/**/*"
Layout/LineLength:
  Enabled: true
  Exclude:
    - bin/bundle
    - db/schema.rb
  Max: 120
Layout/SpaceInsideHashLiteralBraces:
  Enabled: true
  Exclude:
    - db/schema.rb
Lint/RequireParentheses:
  Enabled: true
Style/DefWithParentheses:
  Enabled: true
Style/MethodDefParentheses:
  Enabled: true
Style/MethodCallWithArgsParentheses:
  Enabled: true
Style/StabbyLambdaParentheses:
  Enabled: true
Style/SuperWithArgsParentheses:
  Enabled: true
Style/TernaryParentheses:
  Enabled: true
  EnforcedStyle: require_parentheses_when_complex

# RSpec cops
RSpec/MultipleExpectations:
  # Allow up to 3 expectations in an example
  Max: 3

# RSpec example length
RSpec/ExampleLength:
  # Max number of lines in an example
  Max: 10

# RSpec nested groups
RSpec/NestedGroups:
  # Maximum nesting level for example groups (`describe`, `context`) in specs
  Max: 4

# Rails I18n - disabled for simple projects
Rails/I18nLocaleTexts:
  Enabled: false

# RSpec cops
RSpec/MultipleMemoizedHelpers:
  Max: 6
