---
exclude:
  - ".bundle/**/*"
  - "coverage/**/*"
  - "db/*.sqlite3"
  - "log/**/*"
  - "node_modules/**/*"
  - ".pnpm-store/**/*"
  - "public/**/*"
  - "storage/**/*"
  - "tmp/**/*"
  - "vendor/bundle/**/*"
include:
  - "**/*.rb"
max_files: 5000
plugins:
  - solargraph-rails
  - solargraph-rubocop
reporters:
  - require_not_found
  - rubocop
  - typecheck
  - update_errors
