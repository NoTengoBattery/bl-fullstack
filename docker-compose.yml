---
services:
  postgresql:
    image: postgres:18
    container_name: com.ballastlane.postgresql
    environment:
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - com.ballastlane.project
    volumes:
      - com.ballastlane.postgresql:/var/lib/postgresql:rw

  redis-kvdb:
    &redis
    image: redis:8
    container_name: com.ballastlane.redis-kvdb
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - com.ballastlane.project
    volumes:
      - com.ballastlane.redis-kvdb:/var/lib/redis:rw
      - ./config/redis-kv.conf:/usr/local/etc/redis/redis.conf:ro

  redis-cache:
    <<: *redis
    container_name: com.ballastlane.redis-cache
    volumes:
      - com.ballastlane.redis-cache:/var/lib/redis:rw
      - ./config/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro

  project-base:
    &project-base
    container_name: com.ballastlane.project.base
    build:
      context: .
      args:
        &project-build-args
        GROUP_ID: ${GID:-1000}
        RAILS_ENV: ${RAILS_ENV:-development}
        USER_ID: ${UID:-1000}
    command: [ "bin/rails", "server", "-b", "0.0.0.0" ]
    depends_on:
      postgresql: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      redis-kvdb: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      &project-environment
      CFLAGS: "-O3 -pipe"
      DATABASE_URL_READONLY: postgres://postgres:password@postgresql/project
      DATABASE_URL: postgres://postgres:password@postgresql/project
      PIDFILE: /tmp/server.pid
      PORT: ${PORT:-3000}
      RAILS_ENV: ${RAILS_ENV:-development}
      REDIS_CACHE_URL: redis://redis-cache/0
      REDIS_KVDB_URL: redis://redis-kvdb/0
    env_file:
      - .env
      - .env.local
      - .env.${RAILS_ENV:-development}
      - .env.${RAILS_ENV:-development}.local
    networks:
      - com.ballastlane.project
    tmpfs:
      - /tmp:mode=01777
    user: "${UID:-1000}:${GID:-1000}"
    userns_mode: host
    volumes:
      - .:/project:z

  project-rails-server:
    <<: *project-base
    container_name: com.ballastlane.project.rails.server
    depends_on:
      project-vite-server: { condition: service_healthy }
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-3000}/healthcheck || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  project-vite-server:
    <<: *project-base
    container_name: com.ballastlane.project.vite.server
    command: [ "bin/vite", "dev" ]
    ports:
      - ${VITE_DEV_SERVER_PORT:-3036}:${VITE_DEV_SERVER_PORT:-3036}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:${VITE_DEV_SERVER_PORT:-3036}/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  project-rails-worker:
    <<: *project-base
    container_name: com.ballastlane.project.rails.worker
    command: [ "bin/sidekiq" ]

  project-test-base:
    &project-test-base
    <<: *project-base
    container_name: com.ballastlane.project.test.base
    build:
      context: .
      args:
        <<: *project-build-args
        RAILS_ENV: ${RAILS_ENV:-test}
    command: [ "scripts/specs.zsh" ]
    environment:
      &test-environment
      <<: *project-environment
      DATABASE_URL_READONLY: postgres://postgres:password@postgresql/test
      DATABASE_URL: postgres://postgres:password@postgresql/test
      RAILS_ENV: ${RAILS_ENV:-test}
    env_file:
      - .env
      - .env.local
      - .env.${RAILS_ENV:-test}
      - .env.${RAILS_ENV:-test}.local

  project-test:
    <<: *project-test-base
    container_name: com.ballastlane.project.test
    environment:
      <<: *test-environment
      CI: "true"
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}

  project-test-local:
    <<: *project-test-base
    container_name: com.ballastlane.project.test.local

networks:
  com.ballastlane.project:
    enable_ipv6: false


volumes:
  com.ballastlane.postgresql:
  com.ballastlane.redis-cache:
  com.ballastlane.redis-kvdb: